<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เข้าสู่ระบบ PetPorter</title>
  <style>
    /* สไตล์พื้นฐาน */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
    }

    /* กล่องฟอร์ม */
    .container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 1.8em;
    }

    /* กลุ่มฟอร์ม */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }

    input[type="email"],
    input[type="password"] {
      width: calc(100% - 20px);
      padding: 12px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      box-sizing: border-box; /* รวม padding และ border เข้าไปใน width */
      transition: border-color 0.3s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #4a90e2;
      outline: none;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    /* ปุ่ม */
    .button-group {
      margin-top: 30px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin: 0 8px;
      min-width: 120px;
    }

    button.login-btn {
      background-color: #4a90e2;
      color: white;
    }

    button.login-btn:hover {
      background-color: #357ABD;
      transform: translateY(-2px);
    }

    button.register-btn {
      background-color: #4caf50;
      color: white;
    }

    button.register-btn:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    /* ข้อความแสดงสถานะ */
    #message {
      margin-top: 25px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    #message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
    
  <div class="container">
    <h2>เข้าสู่ระบบ PetPorter</h2>

    <div class="form-group">
      <label for="email">อีเมล</label>
      <input type="email" id="email" placeholder="กรอกอีเมลของคุณ" />
    </div>

    <div class="form-group">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" placeholder="กรอกรหัสผ่านของคุณ" />
    </div>

    <div class="button-group">
      <button class="login-btn" onclick="login()">เข้าสู่ระบบ</button>
      <button class="register-btn" onclick="register()">สมัครสมาชิก</button>
    </div>

    <div id="message"></div>
  </div>

  <script type="module">
    // ✅ นำเข้า SDK แบบ ESM
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ✅ Firebase Config ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyCVmqNGkGLMVW01wjg9RPdzNdHSZCBc4Mc",
      authDomain: "petpaw-6e2f4.firebaseapp.com",
      databaseURL: "https://petpaw-6e2f4-default-rtdb.firebaseio.com",
      projectId: "petpaw-6e2f4",
      storageBucket: "petpaw-6e2f4.firebasestorage.app",
      messagingSenderId: "491729743424",
      appId: "1:491729743424:web:6fcce379d3e948efbab9a5",
      measurementId: "G-BVZQF87FVP"
    };

    // ✅ เริ่มต้น Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app); // ถ้าไม่ได้ใช้ analytics ในหน้านี้ สามารถลบออกได้
    const auth = getAuth(app);
    const database = getDatabase(app);

    const messageDiv = document.getElementById('message');

    function displayMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = ''; // Reset classes
      messageDiv.classList.add(type); // Add success or error class
      messageDiv.style.opacity = '1';

      // ซ่อนข้อความหลังจาก 5 วินาที
      setTimeout(() => {
        messageDiv.style.opacity = '0';
      }, 5000);
    }

    // 👉 ฟังก์ชันเข้าสู่ระบบ
    window.login = function () {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        displayMessage("โปรดกรอกอีเมลและรหัสผ่านให้ครบถ้วน", "error");
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          displayMessage("เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ " + user.email, "success");
          console.log(user);
          // คุณอาจต้องการเปลี่ยนเส้นทางผู้ใช้ไปยังหน้าอื่นที่นี่
           window.location.href = "Petpaw.html";
        })
        .catch((error) => {
          let errorMessage = "เข้าสู่ระบบไม่สำเร็จ: " + error.message;
          // แปลข้อผิดพลาดบางอย่างให้เข้าใจง่ายขึ้น
          if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
            errorMessage = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
          } else if (error.code === 'auth/invalid-email') {
            errorMessage = "รูปแบบอีเมลไม่ถูกต้อง";
          }
          displayMessage(errorMessage, "error");
        });
    }

    // 👉 ฟังก์ชันสมัครสมาชิก
    window.register = function () {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        displayMessage("โปรดกรอกอีเมลและรหัสผ่านให้ครบถ้วน", "error");
        return;
      }

      if (password.length < 6) {
        displayMessage("รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร", "error");
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          // บันทึกข้อมูลผู้ใช้ลง Realtime Database
          set(ref(database, 'users/' + user.uid), {
            email: user.email,
            uid: user.uid,
            createdAt: new Date().toISOString() // เพิ่ม timestamp
          }).then(() => {
            displayMessage("สมัครสมาชิกสำเร็จ! ยินดีต้อนรับ " + user.email, "success");
            console.log("User data saved to RTDB.");
          }).catch((dbError) => {
            console.error("Error writing user to RTDB:", dbError);
            displayMessage("สมัครสมาชิกสำเร็จ แต่บันทึกข้อมูลผู้ใช้ไม่สมบูรณ์: " + dbError.message, "error");
          });
        })
        .catch((error) => {
          let errorMessage = "สมัครไม่สำเร็จ: " + error.message;
          // แปลข้อผิดพลาดบางอย่างให้เข้าใจง่ายขึ้น
          if (error.code === 'auth/email-already-in-use') {
            errorMessage = "อีเมลนี้ถูกใช้ไปแล้ว โปรดใช้อีเมลอื่น";
          } else if (error.code === 'auth/invalid-email') {
            errorMessage = "รูปแบบอีเมลไม่ถูกต้อง";
          } else if (error.code === 'auth/weak-password') {
            errorMessage = "รหัสผ่านอ่อนเกินไป โปรดตั้งรหัสผ่านที่แข็งแรงกว่านี้";
          }
          displayMessage(errorMessage, "error");
        });
    }
  </script>
</body>
</html>
